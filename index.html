<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>«Муслима» медресеси — Визитка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="business-card">
    <div class="decor decor-1"></div>
    <div class="decor decor-2"></div>

    <section class="logo-area">
      <img src="logo.jpg" alt="«Муслима» медресесинин логотиби" class="logo">
    </section>

    <section class="content">
      <p class="organization">ДИНИЙ УЮМ</p>

      <h1>«Муслима» атындагы<br>медресе</h1>

      <p class="slogan">Аялдар үчүн эркин, оңой жана сапаттуу илим</p>

      <div class="line"></div>

      <div class="directions">
        <div class="direction">
          <span class="icon">☪</span>
          <div>
            <strong>Шарият</strong>
            <small>Ислам илимдери</small>
          </div>
        </div>

        <div class="direction">
          <span class="icon">ع</span>
          <div>
            <strong>Араб тили</strong>
            <small>Араб тилин үйрөнүү</small>
          </div>
        </div>
      </div>

      <div class="contact">
        <p><span>📍</span> Ош облусу, Кара-Суу району,<br>
          Датка айылдык аймагы</p>
        <p><span>📞</span> Ош: 3000 27.1</p>
      </div>
    </section>

    <footer>
      <span>Билим • Ыйман • Тарбия</span>
    </footer>
  </main>

</body>
</html>
